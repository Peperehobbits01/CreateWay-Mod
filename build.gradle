plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.peperehobbits01'
base.archivesName = 'createwaymod'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
    maven { url = 'https://cursemaven.com' } 
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = '21.1.265'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabled', 'true'
        }

        server {
            server()
            systemProperty 'neoforge.enabled', 'true'
        }
    }

    mods {
        createwaymod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly 'maven.modrinth:z611fdf7:PQ5wzs3F' // Create Nuclear
    compileOnly 'maven.modrinth:b8kG1VGq:XDz1C9KI' // Aileron
    runtimeOnly 'maven.modrinth:ZJTGwAND:Xzg42PX9' // End Remastered
}
